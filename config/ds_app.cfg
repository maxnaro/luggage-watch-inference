[application]
enable-perf-measurement=1
perf-measurement-interval-sec=5

[tiled-display]
enable=0

[source0]
enable=1
type=3
; uri=file:///path/to/test_video.mp4
num-sources=1
gpu-id=0

[streammux]
batch-size=1
batched-push-timeout=40000
width=640
height=640
gpu-id=0

[primary-gie]
enable=1
gpu-id=0
gie-unique-id=1
config-file=config_infer_primary.txt

[tracker]
enable=1
tracker-width=640
tracker-height=640
gpu-id=0
ll-lib-file=/opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
ll-config-file=tracker_config.yml

[osd]
enable=1
gpu-id=0

[sink0]
enable=1
type=2
sync=0
gpu-id=0